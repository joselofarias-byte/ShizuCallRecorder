name: CI Build 20260814

on:
  push:
    branches:
      - ci/build-20260814-shizu

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        env:
          SKIP_SIGNING: 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ShizuCallRecorder-debug-20260814
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
